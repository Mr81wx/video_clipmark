<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClipMark · 视频标签剪辑台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="ClipMark 首页"><span class="brand-dot"></span>ClipMark</a>
        <div class="project-name"><span>本地项目</span><strong id="fileName">未载入视频</strong></div>
        <div class="topbar-actions">
          <button class="save-button" id="saveProjectButton" type="button" disabled>保存</button>
          <label class="import-button" for="videoInput">导入视频<input id="videoInput" type="file" accept="video/*" /></label>
        </div>
      </header>

      <section class="workspace">
        <div class="player-panel">
          <div class="video-stage" id="videoStage">
            <video id="video" preload="metadata"></video>
            <div class="empty-state" id="emptyState">
              <div class="play-symbol">▶</div>
              <h1>开始标记你的视频</h1>
              <p>导入本地视频，在关键时刻添加标签，随时回放。</p>
              <label class="primary-button" for="videoInput">选择视频文件</label>
            </div>
          </div>
          <div class="controls" id="controls" hidden>
            <button class="icon-button" id="playButton" aria-label="播放或暂停">▶</button>
            <span class="time-display" id="currentTime">00:00</span>
            <input class="scrubber" id="scrubber" type="range" min="0" max="0" value="0" step="0.01" aria-label="视频进度" />
            <span class="time-display" id="duration">00:00</span>
            <button class="icon-button small" id="muteButton" aria-label="静音">◖</button>
          </div>
        </div>

        <aside class="tag-panel">
          <div class="panel-heading"><div><p class="eyebrow">时间轴注释</p><h2>标签</h2></div><span id="tagCount">0 个</span></div>
          <form class="tag-form" id="tagForm">
            <label for="tagText">在当前时间添加标签</label>
            <div class="tag-input-row"><input id="tagText" maxlength="50" placeholder="例如：开场、精彩镜头…" autocomplete="off" /><button type="submit" class="add-button">添加</button></div>
            <p id="tagHint">先导入视频，再创建标签。</p>
          </form>
          <div class="tag-list" id="tagList">
            <div class="tag-placeholder">你的标签会出现在这里</div>
          </div>
        </aside>
      </section>

      <section class="timeline-section" id="timelineSection" hidden>
        <div class="timeline-info"><span id="timelineNow">00:00</span><span>拖动播放头或点选标签跳转</span></div>
        <div class="timeline" id="timeline" aria-label="带标签的视频时间轴">
          <div class="timeline-fill" id="timelineFill"></div>
          <div class="timeline-cursor" id="timelineCursor"></div>
          <div class="markers" id="markers"></div>
        </div>
      </section>
    </main>
    <template id="tagTemplate">
      <article class="tag-card">
        <button class="tag-main" type="button"><time></time><span class="tag-title"></span></button>
        <button class="delete-button" type="button" aria-label="删除标签">×</button>
      </article>
    </template>
    <script src="app.js"></script>
  </body>
</html>
